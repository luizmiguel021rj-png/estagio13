<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Exercício JavaScript innerText</title>
  <style>
    body {
      font-family: "Georgia", serif;
      background-color: #f0f0f0;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 700px;
      margin: 50px auto;
      padding: 20px;
      background-color: #ffffff;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    section {
      margin-bottom: 40px;
    }

    h3 {
      color: #333;
      margin-bottom: 15px;
      font-size: 24px;
    }

    p {
      font-size: 18px;
      color: #444;
    }

    button {
      margin-top: 15px;
      padding: 10px 20px;
      background-color: #007BFF;
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Outras seções acima podem vir aqui -->

    <section>
      <h3>Interatividade com JavaScript</h3>
      <p id="texto-dinamico">Este é o texto original.</p>
      <button onclick="mudarTexto()">Mudar Texto</button>

      <script>
        function mudarTexto() {
          // Seleciona o parágrafo pelo seu ID e altera seu conteúdo de texto
          document.getElementById('texto-dinamico').innerText = 'O texto foi alterado pelo JavaScript!';
        }
      </script>
    </section>
  </div>

</body>
</html>
